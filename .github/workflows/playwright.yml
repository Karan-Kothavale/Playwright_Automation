name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Send Email Notification
        if: ${{ !cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="PASSED"
          else
            STATUS="FAILED"
          fi

          curl -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Playwright CI <onboarding@resend.dev>\",
              \"to\": [\"$MAIL_RECEIVER\"],
              \"subject\": \"Playwright CI - $STATUS\",
              \"html\": \"<h2>Playwright CI Execution</h2><p><b>Status:</b> $STATUS</p><p><b>Repository:</b> ${{ github.repository }}</p><p><b>Branch:</b> ${{ github.ref_name }}</p><p><b>Run:</b> #${{ github.run_number }}</p><p><b>Commit:</b> ${{ github.sha }}</p><p><a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Open GitHub Actions Run</a></p>\"
            }"