name: Playwright Tests

on:
push:
branches: [ main, master ]
pull_request:
branches: [ main, master ]

jobs:
test:
timeout-minutes: 60
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: lts/*

  - name: Install dependencies
    run: npm ci

  - name: Install Playwright Browsers
    run: npx playwright install --with-deps

  - name: Run Playwright Tests
    id: playwright-tests
    continue-on-error: true
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
    run: |
      START_TIME=$(date +%s)

      mkdir -p test-results

      npx playwright test --reporter=html,json

      TEST_EXIT_CODE=$?

      END_TIME=$(date +%s)
      DURATION=$((END_TIME - START_TIME))

      echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      exit $TEST_EXIT_CODE

  - name: Generate Test Summary
    if: always()
    run: |
      node <<'EOF'
      const fs = require('fs');

      const file = 'test-results/results.json';

      let total = 0;
      let passed = 0;
      let failed = 0;
      let skipped = 0;
      const failedTests = [];

      function processSuite(suite) {
        if (!suite) return;

        if (suite.specs) {
          for (const spec of suite.specs) {
            for (const test of (spec.tests || [])) {
              total++;

              const results = test.results || [];

              if (results.length === 0) {
                skipped++;
                continue;
              }

              const finalResult = results[results.length - 1];

              if (finalResult.status === 'passed') {
                passed++;
              } else if (
                finalResult.status === 'failed' ||
                finalResult.status === 'timedOut' ||
                finalResult.status === 'interrupted'
              ) {
                failed++;
                failedTests.push(spec.title);
              } else {
                skipped++;
              }
            }
          }
        }

        if (suite.suites) {
          for (const childSuite of suite.suites) {
            processSuite(childSuite);
          }
        }
      }

      try {
        if (fs.existsSync(file)) {
          const report = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          for (const suite of (report.suites || [])) {
            processSuite(suite);
          }
        } else {
          console.log('Playwright JSON report not found.');
        }
      } catch (error) {
        console.error(
          'Unable to parse Playwright JSON report:',
          error.message
        );
      }

      const duration =
        '${{ steps.playwright-tests.outputs.duration }}';

      const status =
        '${{ steps.playwright-tests.outcome }}' === 'success'
          ? 'PASSED'
          : 'FAILED';

      const summary = {
        status,
        total,
        passed,
        failed,
        skipped,
        duration,
        failedTests
      };

      fs.mkdirSync('test-results', { recursive: true });

      fs.writeFileSync(
        'test-results/summary.json',
        JSON.stringify(summary, null, 2)
      );

      console.log(JSON.stringify(summary, null, 2));

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `TEST_STATUS=${status}\n`
      );

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `TEST_TOTAL=${total}\n`
      );

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `TEST_PASSED=${passed}\n`
      );

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `TEST_FAILED=${failed}\n`
      );

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `TEST_SKIPPED=${skipped}\n`
      );

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `TEST_DURATION=${duration}\n`
      );

      const failedTestsText =
        failedTests.length > 0
          ? failedTests.map(test => `❌ ${test}`).join('<br>')
          : 'None';

      fs.appendFileSync(
        process.env.GITHUB_ENV,
        `FAILED_TESTS<<EOF\n${failedTestsText}\nEOF\n`
      );
      EOF

  - name: Upload Playwright Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playwright-report
      path: playwright-report/
      retention-days: 30

  - name: Send Enterprise CI Email
    if: always()
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
      TEST_STATUS: ${{ env.TEST_STATUS }}
      TEST_TOTAL: ${{ env.TEST_TOTAL }}
      TEST_PASSED: ${{ env.TEST_PASSED }}
      TEST_FAILED: ${{ env.TEST_FAILED }}
      TEST_SKIPPED: ${{ env.TEST_SKIPPED }}
      TEST_DURATION: ${{ env.TEST_DURATION }}
      FAILED_TESTS: ${{ env.FAILED_TESTS }}
    run: |
      node <<'EOF'
      const status = process.env.TEST_STATUS;
      const total = process.env.TEST_TOTAL;
      const passed = process.env.TEST_PASSED;
      const failed = process.env.TEST_FAILED;
      const skipped = process.env.TEST_SKIPPED;
      const duration = process.env.TEST_DURATION;
      const failedTests = process.env.FAILED_TESTS || 'None';

      const runUrl =
        `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

      const statusIcon =
        status === 'PASSED' ? 'PASSED' : 'FAILED';

      const html = `
      <div style="margin:0;padding:30px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
        <div style="max-width:720px;margin:auto;background:#ffffff;border:1px solid #dfe3e8;border-radius:8px;overflow:hidden;">

          <div style="padding:24px;border-bottom:1px solid #e5e7eb;">
            <h2 style="margin:0;font-size:22px;">Playwright Automation CI</h2>
            <p style="margin:7px 0 0;color:#6b7280;font-size:14px;">
              Continuous Integration Execution Report
            </p>
          </div>

          <div style="padding:24px;">

            <div style="padding:18px;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:6px;">
              <div style="font-size:20px;font-weight:bold;">
                ${statusIcon}
              </div>
              <div style="margin-top:6px;color:#6b7280;">
                Playwright test execution completed.
              </div>
            </div>

            <h3 style="margin-top:28px;">Test Summary</h3>

            <table style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr>
                <td style="padding:9px 0;color:#6b7280;">Total Tests</td>
                <td style="padding:9px 0;font-weight:bold;">${total}</td>
              </tr>
              <tr>
                <td style="padding:9px 0;color:#6b7280;">Passed</td>
                <td style="padding:9px 0;font-weight:bold;">${passed}</td>
              </tr>
              <tr>
                <td style="padding:9px 0;color:#6b7280;">Failed</td>
                <td style="padding:9px 0;font-weight:bold;">${failed}</td>
              </tr>
              <tr>
                <td style="padding:9px 0;color:#6b7280;">Skipped</td>
                <td style="padding:9px 0;font-weight:bold;">${skipped}</td>
              </tr>
              <tr>
                <td style="padding:9px 0;color:#6b7280;">Duration</td>
                <td style="padding:9px 0;font-weight:bold;">${duration} seconds</td>
              </tr>
            </table>

            <h3 style="margin-top:28px;">Execution Details</h3>

            <table style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr>
                <td style="padding:8px 0;color:#6b7280;">Repository</td>
                <td style="padding:8px 0;font-weight:bold;">${process.env.GITHUB_REPOSITORY}</td>
              </tr>
              <tr>
                <td style="padding:8px 0;color:#6b7280;">Branch</td>
                <td style="padding:8px 0;font-weight:bold;">${process.env.GITHUB_REF_NAME}</td>
              </tr>
              <tr>
                <td style="padding:8px 0;color:#6b7280;">Workflow</td>
                <td style="padding:8px 0;font-weight:bold;">${process.env.GITHUB_WORKFLOW}</td>
              </tr>
              <tr>
                <td style="padding:8px 0;color:#6b7280;">Run Number</td>
                <td style="padding:8px 0;font-weight:bold;">#${process.env.GITHUB_RUN_NUMBER}</td>
              </tr>
              <tr>
                <td style="padding:8px 0;color:#6b7280;">Commit</td>
                <td style="padding:8px 0;font-weight:bold;">${process.env.GITHUB_SHA}</td>
              </tr>
            </table>

            <h3 style="margin-top:28px;">Failed Tests</h3>

            <div style="padding:14px;background:#fff7f7;border:1px solid #f0d0d0;border-radius:6px;font-size:14px;">
              ${failedTests}
            </div>

            <div style="margin-top:28px;">
              <a href="${runUrl}"
                 style="display:inline-block;padding:12px 20px;background:#24292f;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">
                View CI Run
              </a>
            </div>

            <p style="margin-top:22px;color:#6b7280;font-size:13px;">
              The complete Playwright HTML report is available in the workflow artifacts.
            </p>

          </div>

          <div style="padding:16px 24px;background:#f8f9fa;border-top:1px solid #e5e7eb;">
            <p style="margin:0;color:#6b7280;font-size:12px;">
              This is an automated notification generated by the Playwright Automation CI pipeline.
            </p>
          </div>

        </div>
      </div>`;

      const payload = {
        from: 'Playwright CI <onboarding@resend.dev>',
        to: [process.env.MAIL_RECEIVER],
        subject:
          `Playwright CI - ${statusIcon} | Run #${process.env.GITHUB_RUN_NUMBER}`,
        html
      };

      const response = await fetch(
        'https://api.resend.com/emails',
        {
          method: 'POST',
          headers: {
            'Authorization':
              `Bearer ${process.env.RESEND_API_KEY}`,
            'Content-Type':
              'application/json'
          },
          body: JSON.stringify(payload)
        }
      );

      const responseText = await response.text();

      console.log(
        `Resend HTTP Status: ${response.status}`
      );

      console.log(
        `Resend Response: ${responseText}`
      );

      if (!response.ok) {
        throw new Error(
          `Resend email failed: ${responseText}`
        );
      }

      console.log(
        'Enterprise CI email sent successfully.'
      );
      EOF

  - name: Fail CI if Playwright tests failed
    if: steps.playwright-tests.outcome == 'failure'
    run: |
      echo "Playwright tests failed. Marking CI run as failed."
      exit 1
```
